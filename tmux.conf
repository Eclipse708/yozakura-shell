# ~/.tmux.conf — Yozakura (夜桜), 2026-10-05.
# Prefix is the default Ctrl-b. Reload with prefix r.

# ---- terminal ---------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"
set -s escape-time 10
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g display-time 1500
setw -g monitor-activity on
set -g visual-activity off

# ---- keys -------------------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "  ❀ config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# vi-style copy; y copies to the Windows clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"

# ---- palette ----------------------------------------------------------------------------------
# bg #0b0a0d  surface #141218  raised #1a171c  rule #26222b  ash #4a3f4a
# sakura #e8a4b8  plum #b58bb3  gold #d4a373  mist #8a7d8a  dusk #6e6270  fg #d8cfd6

set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#141218,fg=#6e6270"

set -g status-left-length 40
set -g status-left "#[fg=#e8a4b8,bold] ❀ #S #[fg=#4a3f4a,nobold]│ "

set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#d4a373]⌨ prefix ,}#[fg=#8a7d8a]#h #[fg=#4a3f4a]│ #[fg=#8a7d8a]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6e6270] #I #W#{?window_zoomed_flag, ⊕,} "
setw -g window-status-current-format "#[fg=#0b0a0d,bg=#e8a4b8,bold] #I #W#{?window_zoomed_flag, ⊕,} #[default]"
setw -g window-status-activity-style "fg=#d4a373"
setw -g window-status-bell-style "fg=#c9697f"

set -g pane-border-style "fg=#26222b"
set -g pane-active-border-style "fg=#b58bb3"
set -g pane-border-lines single

set -g message-style "bg=#1a171c,fg=#e8a4b8"
set -g message-command-style "bg=#1a171c,fg=#d4a373"
set -g mode-style "bg=#3b2a35,fg=#d8cfd6"
set -g clock-mode-colour "#e8a4b8"
set -g clock-mode-style 24
set -g display-panes-active-colour "#e8a4b8"
set -g display-panes-colour "#6e6270"
